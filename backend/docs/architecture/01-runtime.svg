<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
<title id="title">运行结构：一个模块化的 PHP / Yii2 应用</title>
<desc id="desc">先把 HumHub 理解成一个应用。用户、好友、Space、内容和通知是同一应用内的模块，不是多个微服务。当前实现使用 Controller、ActiveRecord、Behavior 和部分 Service；这张图不把它描述成已经完成的 Clean Architecture。</desc>
