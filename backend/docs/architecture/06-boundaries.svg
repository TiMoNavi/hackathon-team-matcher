<text x="67" y="898" font-size="14" font-weight="400" fill="#334155" text-anchor="start">切换不清除好友与既有私聊</text>
<text x="67" y="920" font-size="14" font-weight="400" fill="#334155" text-anchor="start">不能只靠前端过滤</text>
<rect x="455" y="795" width="350" height="190" rx="12" fill="#fff6e6" stroke="#ba7b20" stroke-width="1.8" stroke-dasharray="7 5"/>
