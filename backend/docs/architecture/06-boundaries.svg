<rect x="50" y="1020" width="1180" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="68" y="1047" font-size="14" font-weight="650" fill="#334155" text-anchor="start">读图提醒</text>
<text x="68" y="1071" font-size="13" font-weight="400" fill="#53657b" text-anchor="start">1. Space：有成员、角色、权限和内容流的协作容器。活动：邀请加入并切换的业务上下文；发现、筛选、搜索、推荐必须绑定服务端验证的当前活动。</text>
<text x="68" y="1093" font-size="13" font-weight="400" fill="#53657b" text-anchor="start">2. 想法：用户提出的项目或合作意向；想法与 Space 的最终映射尚未决定。同一想法跨活动的讨论成员和消息不能串用。</text>
