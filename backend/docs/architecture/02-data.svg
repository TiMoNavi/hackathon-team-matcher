<polyline points="600,475 600,600" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="745,665 920,665" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="600,735 600,845" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="330,900 380,900 380,420 330,420" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="50" y="140" width="280" height="105" rx="12" fill="#edf5ff" stroke="#3975ba" stroke-width="1.8"/>
<text x="67" y="171" font-size="17" font-weight="650" fill="#1c304b" text-anchor="start">user · 用户</text>
<text x="67" y="199" font-size="14" font-weight="400" fill="#334155" text-anchor="start">账号、身份、资料入口</text>
<rect x="455" y="140" width="290" height="105" rx="12" fill="#edf5ff" stroke="#3975ba" stroke-width="1.8"/>
<text x="472" y="171" font-size="17" font-weight="650" fill="#1c304b" text-anchor="start">space_membership</text>
<text x="472" y="199" font-size="14" font-weight="400" fill="#334155" text-anchor="start">user_id + space_id</text>
<text x="472" y="221" font-size="14" font-weight="400" fill="#334155" text-anchor="start">成员状态与空间角色</text>
<rect x="920" y="140" width="300" height="105" rx="12" fill="#edf5ff" stroke="#3975ba" stroke-width="1.8"/>
<text x="937" y="171" font-size="17" font-weight="650" fill="#1c304b" text-anchor="start">space · 协作空间</text>
<text x="937" y="199" font-size="14" font-weight="400" fill="#334155" text-anchor="start">自己的成员、权限和内容流</text>
<rect x="50" y="365" width="280" height="110" rx="12" fill="#edf5ff" stroke="#3975ba" stroke-width="1.8"/>
<text x="67" y="396" font-size="17" font-weight="650" fill="#1c304b" text-anchor="start">profile · 用户资料</text>
<text x="67" y="424" font-size="14" font-weight="400" fill="#334155" text-anchor="start">通过 user_id 关联用户</text>
<text x="67" y="446" font-size="14" font-weight="400" fill="#334155" text-anchor="start">字段可由管理员配置</text>
<rect x="455" y="365" width="290" height="110" rx="12" fill="#edf5ff" stroke="#3975ba" stroke-width="1.8"/>
<text x="472" y="396" font-size="17" font-weight="650" fill="#1c304b" text-anchor="start">contentcontainer</text>
<text x="472" y="424" font-size="14" font-weight="400" fill="#334155" text-anchor="start">关联 User 或 Space</text>
<text x="472" y="446" font-size="14" font-weight="400" fill="#334155" text-anchor="start">统一承载内容归属</text>
<rect x="50" y="600" width="280" height="120" rx="12" fill="#edf5ff" stroke="#3975ba" stroke-width="1.8"/>
<text x="67" y="631" font-size="17" font-weight="650" fill="#1c304b" text-anchor="start">user_friendship</text>
<text x="67" y="659" font-size="14" font-weight="400" fill="#334155" text-anchor="start">A → B：发送申请</text>
<text x="67" y="681" font-size="14" font-weight="400" fill="#334155" text-anchor="start">A → B + B → A：好友</text>
<rect x="455" y="600" width="290" height="135" rx="12" fill="#edf5ff" stroke="#3975ba" stroke-width="1.8"/>
<text x="472" y="631" font-size="17" font-weight="650" fill="#1c304b" text-anchor="start">content · 通用内容信息</text>
<text x="472" y="659" font-size="14" font-weight="400" fill="#334155" text-anchor="start">容器、作者、状态、可见性</text>
<text x="472" y="681" font-size="14" font-weight="400" fill="#334155" text-anchor="start">object_model / object_id</text>
<rect x="920" y="600" width="300" height="135" rx="12" fill="#edf5ff" stroke="#3975ba" stroke-width="1.8"/>
<text x="937" y="631" font-size="17" font-weight="650" fill="#1c304b" text-anchor="start">post · 帖子正文</text>
<text x="937" y="659" font-size="14" font-weight="400" fill="#334155" text-anchor="start">title / message 等</text>
<text x="937" y="681" font-size="14" font-weight="400" fill="#334155" text-anchor="start">继承 ContentActiveRecord</text>
<rect x="50" y="845" width="280" height="110" rx="12" fill="#edf5ff" stroke="#3975ba" stroke-width="1.8"/>
<text x="67" y="876" font-size="17" font-weight="650" fill="#1c304b" text-anchor="start">profile_field · 字段定义</text>
<text x="67" y="904" font-size="14" font-weight="400" fill="#334155" text-anchor="start">类型、必填、可改、可搜索</text>
<text x="67" y="926" font-size="14" font-weight="400" fill="#334155" text-anchor="start">属于配置，不是个人授权</text>
<rect x="455" y="845" width="290" height="110" rx="12" fill="#edf5ff" stroke="#3975ba" stroke-width="1.8"/>
<text x="472" y="876" font-size="17" font-weight="650" fill="#1c304b" text-anchor="start">comment / like</text>
<text x="472" y="904" font-size="14" font-weight="400" fill="#334155" text-anchor="start">通过 content_id 关联</text>
<text x="472" y="926" font-size="14" font-weight="400" fill="#334155" text-anchor="start">评论还可以有父评论</text>
<rect x="361.8125" y="155" width="60.375" height="22" rx="4" fill="white"/>
