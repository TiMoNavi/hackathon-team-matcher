<text x="875" y="284" font-size="12.5" font-weight="500" fill="#475569" text-anchor="middle">空间内容容器</text>
<rect x="630.5" y="527" width="89.0" height="22" rx="4" fill="white"/>
<text x="675" y="542" font-size="12.5" font-weight="500" fill="#475569" text-anchor="middle">承载多条内容</text>
