<text x="68" y="1041" font-size="13" font-weight="400" fill="#53657b" text-anchor="start">1. user_friendship 使用两个方向的记录表示互相确认的好友关系，不能把单向记录直接当成已成为好友。</text>
<text x="68" y="1063" font-size="13" font-weight="400" fill="#53657b" text-anchor="start">2. content 的 object_model / object_id 是多态关联，图中的线不全部代表数据库外键。</text>
