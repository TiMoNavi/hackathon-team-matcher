<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
<title id="title">核心数据关系：人、关系、空间与内容</title>
<desc id="desc">用户与 Space 都可以成为内容容器。帖子正文与通用内容元数据分开；评论和点赞再关联内容。好友和空间成员是两种独立关系。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1280" height="100%" fill="#ffffff"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<text x="50" y="45" font-size="25" font-weight="650" fill="#16243b" text-anchor="start">核心数据关系：人、关系、空间与内容</text>
<text x="50" y="77" font-size="14" font-weight="400" fill="#53657b" text-anchor="start">概念关系简图，不是完整数据库 ER 约束清单。</text>
